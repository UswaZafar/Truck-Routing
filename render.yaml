# Render blueprint: New → Blueprint → select this repository.
services:
  - type: web
    name: weather-aware-truck-routing
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      # Optional: an Open-Meteo customer key removes the free tier's 600/min · 5,000/h · 10,000/day limits.
      - key: OPEN_METEO_API_KEY
        sync: false
