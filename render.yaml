# Render blueprint: New → Blueprint → select this repository.
services:
  - type: web
    name: weather-aware-truck-routing
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      # Browser origins allowed to call this API (local + any *.vercel.app via regex in settings).
      # Add your exact Vercel URL here too if you use a custom domain, e.g. https://my-app.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      # Optional: an Open-Meteo customer key removes the free tier's 600/min · 5,000/h · 10,000/day limits.
      - key: OPEN_METEO_API_KEY
        sync: false
